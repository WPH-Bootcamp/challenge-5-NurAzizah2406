<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aplikasi To-Do List modern dan premium dengan Class, Async/Await API, dan DOM Manipulation."
    />
    <title>Premium Task Manager - To-Do App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dark-theme">
    <!-- Background Glow Effects -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-top">
          <div class="date-container">
            <span id="current-day" class="text-muted">Senin</span>
            <span id="current-date" class="font-semibold">1 Juni 2026</span>
          </div>
          <button id="theme-toggle" class="btn-icon" aria-label="Ganti Tema">
            <!-- Sun Icon -->
            <svg
              class="sun-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <!-- Moon Icon -->
            <svg
              class="moon-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </button>
        </div>
        <div class="header-main">
          <h1 class="app-title">TaskFlow</h1>
          <p class="app-subtitle">
            Kelola produktivitas harianmu setiap hari!
          </p>
        </div>

        <!-- Stats Progress Card -->
        <div class="stats-card">
          <div class="stats-info">
            <span class="stats-label">Progress Tugas</span>
            <span id="stats-percentage" class="stats-val">0%</span>
          </div>
          <div class="progress-bar-container">
            <div
              id="progress-bar"
              class="progress-bar-fill"
              style="width: 0%"
            ></div>
          </div>
          <div class="stats-summary">
            <span
              ><strong id="stats-completed">0</strong> dari
              <strong id="stats-total">0</strong> selesai</span
            >
          </div>
        </div>
      </header>

      <main class="app-content">
        <!-- Input Form -->
        <form id="todo-form" class="todo-form">
          <div class="input-wrapper">
            <input
              type="text"
              id="todo-input"
              class="todo-input"
              placeholder="Apa rencana tugasmu hari ini?"
              autocomplete="off"
              required
            />
            <span class="input-focus-line"></span>
          </div>
          <button type="submit" id="todo-add-btn" class="btn-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
            Tambah
          </button>
        </form>

        <!-- Filter Navigation & Actions -->
        <div class="controls-panel">
          <nav class="filter-nav" aria-label="Filter Tugas">
            <button class="filter-tab active" data-filter="all">
              Semua <span id="count-all" class="badge">0</span>
            </button>
            <button class="filter-tab" data-filter="active">
              Aktif <span id="count-active" class="badge">0</span>
            </button>
            <button class="filter-tab" data-filter="completed">
              Selesai <span id="count-completed" class="badge">0</span>
            </button>
          </nav>
          <button
            id="clear-completed-btn"
            class="btn-text"
            title="Hapus semua tugas yang telah selesai"
          >
            Sapu Bersih Selesai
          </button>
        </div>

        <!-- Main Todo List Container -->
        <section class="list-section">
          <!-- Skeleton Loading State (Shown initially) -->
          <div id="loading-state" class="loading-state">
            <div class="skeleton-item">
              <div class="skeleton-checkbox"></div>
              <div class="skeleton-text"></div>
              <div class="skeleton-btn"></div>
            </div>
            <div class="skeleton-item">
              <div class="skeleton-checkbox"></div>
              <div class="skeleton-text-short"></div>
              <div class="skeleton-btn"></div>
            </div>
            <div class="skeleton-item">
              <div class="skeleton-checkbox"></div>
              <div class="skeleton-text"></div>
              <div class="skeleton-btn"></div>
            </div>
          </div>

          <!-- Real Task List -->
          <ul id="todo-list" class="todo-list hidden"></ul>

          <!-- Empty State Container -->
          <div id="empty-state" class="empty-state hidden">
            <div class="empty-illustration">
              <!-- Custom Clean SVG Illustration -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 200 200"
                width="120"
                height="120"
                fill="none"
              >
                <circle
                  cx="100"
                  cy="100"
                  r="80"
                  fill="var(--color-bg-illustration)"
                />
                <rect
                  x="70"
                  y="60"
                  width="60"
                  height="80"
                  rx="8"
                  fill="var(--color-card-illustration)"
                  stroke="var(--color-accent-illustration)"
                  stroke-width="3"
                />
                <line
                  x1="82"
                  y1="80"
                  x2="118"
                  y2="80"
                  stroke="var(--color-text-illustration)"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <line
                  x1="82"
                  y1="100"
                  x2="118"
                  y2="100"
                  stroke="var(--color-text-illustration)"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <line
                  x1="82"
                  y1="120"
                  x2="105"
                  y2="120"
                  stroke="var(--color-text-illustration)"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <circle
                  cx="100"
                  cy="140"
                  r="16"
                  fill="var(--color-accent-illustration)"
                />
                <path
                  d="M96 140l3 3 5-5"
                  stroke="#FFF"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <h3 class="empty-title">Belum ada tugas</h3>
            <p class="empty-desc text-muted">
              Mulai harimu dengan menambahkan tugas baru di atas atau biarkan
              kami menarik data contoh dari API.
            </p>
            <button id="fetch-trigger-btn" class="btn-secondary">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M16 16h5v5" />
              </svg>
              Ambil Data dari API
            </button>
          </div>
        </section>
      </main>

      <!-- Footer -->
      <footer class="app-footer text-muted">
        <p>Let's get things done!</p>
        <p class="footer-credit">To-Do-List-App &bull; By Nur Azizah</p>
      </footer>
    </div>

    <!-- Toast Notification Overlay Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- JavaScript file -->
    <script src="script.js"></script>
  </body>
</html>
